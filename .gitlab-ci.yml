mirror-toolbox-to-github:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: none   # we do our own clone below; no need for GitLab's default checkout
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet git-filter-repo
  script:
    - git clone https://gitlab.com/dreem/dreem-2.git repo
    - cd repo
    - git filter-repo --subdirectory-filter toolbox --force
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/urbanwuensch/drEEM-online.git"
    - git push github HEAD:main --force